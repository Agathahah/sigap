# Phase 9 / 9b · models the copilot can run on, with prices in USD per 1,000,000 tokens.
# Prices change: check the provider page and update `checked` before every evaluation run.
# Local models cost 0 per token here; their real cost (hardware, electricity, your time) goes in ADR 0008.
checked: "2026-10-29"   # https://platform.claude.com/docs/en/about-claude/pricing

models:
  # Default. Released 7 Oct 2026; price for prompts up to 100,000 tokens (the copilot's are far below that).
  # Claude 5.x models reject `temperature`, so the copilot does not send it (agent.make_llm).
  # https://platform.claude.com/docs/en/models/haiku-5-5/overview
  "anthropic:claude-haiku-5-5":
    price: {input_per_mtok: 0.10, output_per_mtok: 0.50}
    data_leaves_laptop: true
  "anthropic:claude-haiku-4-5":
    price: {input_per_mtok: 1.0, output_per_mtok: 5.0}
    data_leaves_laptop: true

  "ollama:hermes3:8b":                 # RAM 8 GB. 4.7 GB download. Licence: Meta Llama 3 Community License
    price: {input_per_mtok: 0.0, output_per_mtok: 0.0}
    data_leaves_laptop: false
  "ollama:hf.co/bartowski/NousResearch_Hermes-4-14B-GGUF:Q4_K_M":   # RAM >= 16 GB. ~9 GB. Base licence Apache-2.0
    price: {input_per_mtok: 0.0, output_per_mtok: 0.0}               # community quantization (bartowski), not Nous
    data_leaves_laptop: false
