# Business assumptions for a FICTIONAL Indonesian digital bank ("Bank Nusa Digital").
# BAF has no money amounts, so every number below is an ASSUMPTION. That is fine if you:
#   1. write the reasoning and a public reference point next to each value,
#   2. never present the result as a measured saving,
#   3. show a sensitivity table (low / base / high) in docs/04_DECISION_POLICY.md.
# TODO(Agatha) phase 6: fill every null. Keep units in IDR.

currency: IDR

applications_per_day: null          # e.g. how many accounts a mid-size digital bank opens per day; cite a source
review_capacity_per_day: null       # analysts x reviews per analyst per day (state both)
max_review_rate: null               # = review_capacity_per_day / applications_per_day

costs:
  fraud_loss: null                  # loss when a fraudulent account is opened (mule account, stolen identity)
  review_cost: null                 # cost of one manual review (analyst minutes x loaded cost per minute)
  review_catch_rate: null           # share of fraud an analyst stops in review (0-1)
  good_decline_cost: null           # value lost when a genuine customer is declined (CAC + expected margin)
  good_review_cost: null            # friction: genuine customer abandons during review (drop-off x value)

sensitivity:                        # low and high for the assumptions you are least sure about
  fraud_loss: [null, null]
  review_catch_rate: [null, null]
  good_decline_cost: [null, null]
