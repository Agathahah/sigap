# Release gate (phase 5). Decide these BEFORE you look at test results, and explain each in the model card.
min:
  test_tpr_at_5fpr: 0.40
  test_pr_auc: 0.10
  test_fpr_ratio_age: 0.50   # ADR 0005: FPR of one age group at most 2x the other. Set on 28 Oct from month-5
                             # results, before any test month was scored. Never lower it after seeing test.
max:
  test_fpr: 0.06
  test_ece: 0.05
  score_psi_test_vs_train: 0.25
