# Data contract for one BAF application, checked at the door (quality stage) and used to build the explicit
# Spark schema (pipeline stage).
#
# Ranges: the value range observed in the BAF Base file (all 1,000,000 rows, checked 27 Oct 2026), which matches
# the feature descriptions in the BAF datasheet (feedzai/bank-account-fraud, documents/datasheet.pdf).
# A future drop outside these ranges means the source changed and is quarantined for review.
#
# Keys per column: type (int|float|str), nullable (default false), min, max, allowed

columns:
  application_id: {type: str}
  income: {type: float, min: 0.1, max: 0.9}                       # income decile as a fraction
  name_email_similarity: {type: float, min: 0, max: 1}
  prev_address_months_count: {type: int, min: -1, max: 383}       # -1 = no previous address (sentinel)
  current_address_months_count: {type: int, min: -1, max: 428}    # -1 = unknown (sentinel)
  customer_age: {type: int, min: 10, max: 90}                     # rounded to decades
  days_since_request: {type: float, min: 0, max: 79}
  intended_balcon_amount: {type: float, min: -16, max: 113}       # negative = no amount given (sentinel)
  payment_type: {type: str, allowed: [AA, AB, AC, AD, AE]}
  zip_count_4w: {type: int, min: 1, max: 6700}
  velocity_6h: {type: float, min: -171, max: 16716}               # 44 slightly negative values exist in the source
  velocity_24h: {type: float, min: 1300, max: 9507}
  velocity_4w: {type: float, min: 2825, max: 6995}
  bank_branch_count_8w: {type: int, min: 0, max: 2385}
  date_of_birth_distinct_emails_4w: {type: int, min: 0, max: 39}
  employment_status: {type: str, allowed: [CA, CB, CC, CD, CE, CF, CG]}
  credit_risk_score: {type: int, min: -170, max: 389}             # internal score; negative values are valid
  email_is_free: {type: int, allowed: [0, 1]}
  housing_status: {type: str, allowed: [BA, BB, BC, BD, BE, BF, BG]}
  phone_home_valid: {type: int, allowed: [0, 1]}
  phone_mobile_valid: {type: int, allowed: [0, 1]}
  bank_months_count: {type: int, min: -1, max: 32}                # -1 = no previous bank account (sentinel)
  has_other_cards: {type: int, allowed: [0, 1]}
  proposed_credit_limit: {type: float, min: 190, max: 2100}
  foreign_request: {type: int, allowed: [0, 1]}
  source: {type: str, allowed: [INTERNET, TELEAPP]}
  session_length_in_minutes: {type: float, min: -1, max: 86}      # -1 = not recorded (sentinel)
  device_os: {type: str, allowed: [windows, linux, macintosh, x11, other]}
  keep_alive_session: {type: int, allowed: [0, 1]}
  device_distinct_emails_8w: {type: int, min: -1, max: 2}         # -1 = not recorded (sentinel)
  device_fraud_count: {type: int, min: 0, max: 0}                 # constant 0 in Base: carries no information
  month: {type: int, min: 0, max: 7}

# Missing values encoded as -1 or any negative value. The silver stage turns them into NULL plus a
# <column>_missing flag, because "missing" is itself a fraud signal in this data.
sentinels:
  prev_address_months_count: eq_-1
  current_address_months_count: eq_-1
  intended_balcon_amount: lt_0
  bank_months_count: eq_-1
  session_length_in_minutes: eq_-1
  device_distinct_emails_8w: eq_-1

protected_attributes: [customer_age, income, employment_status]  # never sent to the LLM; used for fairness checks
